<svg width="960" height="560" viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .code  { font: 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill:#064e3b }
      .pkg   { fill:#ecfdf5; stroke:#22c55e; stroke-width:2; rx:14 }
      .runtime { fill:#eff6ff; stroke:#3b82f6; stroke-width:2; rx:12 }
      .arrow { stroke:#374151; stroke-width:2.5; marker-end:url(#arrowhead) }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151"/>
    </marker>
  </defs>

  <!-- package.json -->
  <rect x="300" y="90" width="360" height="300" class="pkg"/>
  <text x="480" y="125" text-anchor="middle" class="label">package.json</text>

  <text x="320" y="160" class="code">{</text>
  <text x="340" y="185" class="code">"name": "my-lib",</text>
  <text x="340" y="210" class="code">"exports": {</text>
  <text x="360" y="235" class="code">".": {</text>
  <text x="380" y="260" class="code">"node": "./dist/node.js",</text>
  <text x="380" y="285" class="code">"browser": "./dist/browser.js",</text>
  <text x="380" y="310" class="code">"default": "./dist/index.js"</text>
  <text x="360" y="335" class="code">}</text>
  <text x="340" y="360" class="code">}</text>
  <text x="320" y="385" class="code">}</text>

  <!-- Node -->
  <rect x="40" y="140" width="220" height="90" class="runtime"/>
  <text x="150" y="170" text-anchor="middle" class="label">Node.js</text>
  <text x="60" y="200" class="code">loads: dist/node.js</text>

  <!-- Browser -->
  <rect x="40" y="270" width="220" height="90" class="runtime"/>
  <text x="150" y="300" text-anchor="middle" class="label">Browser / Bundler</text>
  <text x="60" y="330" class="code">loads: dist/browser.js</text>

  <!-- Default -->
  <rect x="700" y="205" width="220" height="90" class="runtime"/>
  <text x="810" y="235" text-anchor="middle" class="label">Other Runtimes</text>
  <text x="720" y="265" class="code">loads: dist/index.js</text>

  <!-- Arrows -->
  <line x1="260" y1="185" x2="300" y2="235" class="arrow"/>
  <line x1="260" y1="315" x2="300" y2="285" class="arrow"/>
  <line x1="660" y1="260" x2="700" y2="260" class="arrow"/>

</svg>
